<head>

<body>

<h1>Control de Entrada de Usuarios del CID 2025</h1>

<form action="guardar_registro.php" method="post">

<!-- === Datos principales === -->
<label for="fecha">1. Fecha de ingreso</label>
<input type="date" id="fecha" name="fecha" required>

<label for="hora">2. Hora de entrada</label>
<input type="time" id="hora" name="hora" required>

<label for="nombre">3. Nombre(s)</label>
<input type="text" id="nombre" name="nombre" required>

<label for="apellidoP">4. Apellido paterno</label>
<input type="text" id="apellidoP" name="apellidoP" required>

<label for="apellidoM">5. Apellido materno</label>
<input type="text" id="apellidoM" name="apellidoM" required>

<label for="sexo">6. Sexo</label>
<select id="sexo" name="sexo" required>

    <option>Masculino</option>
    <option>Femenino</option>
    <option>Otro</option>
</select>

<label for="matricula">7. Número de Matrícula o empleado</label>

        <option value="INGENIERÍA_EN_NANOTECNOLOGÍA">INGENIERÍA EN NANOTECNOLOGÍA</option>
        <option value="INGENIERÍA_EN_MECÁNICA_AUTOMOTRIZ">INGENIERÍA EN MECÁNICA AUTOMOTRIZ</option>

        <option value="MAESTRÍA_EN_INGENIERÍA_MECATRÓNICA">MAESTRÍA EN INGENIERÍA MECATRÓNICA</option>
        <option value="DOCTORADO_EN_CIENCIA_DE_MATERIALES">DOCTORADO EN CIENCIA DE MATERIALES</option>
        <option value="MAESTRÍA_EN_TECNOLOGÍAS_DE_LA_INFORMACIÓN_Y_COMUNICACIONES_CON_ESPECIALIDAD_EN_DESARROLLO_DE_SISTEMAS_DE_COMPUTACIÓN_Y_COMUNICACIÓN.">MAESTRÍA EN TECNOLOGÍAS DE LA INFORMACIÓN Y COMUNICACIONES CON ESPECIALIDAD EN DESARROLLO DE SISTEMAS DE COMPUTACIÓN Y COMUNICACIÓN.</option>

    </select>
</div>

        <option value="DEPARTAMENTO_DE_COMPUTACIÓN_Y_TELEMÁTICA">DEPARTAMENTO DE COMPUTACIÓN Y TELEMÁTICA</option>

        <option value="DEPARTAMENTO_DE_CULTURA_Y_DEPORTE">DEPARTAMENTO DE CULTURA Y DEPORTE</option>

        <option value="DEPARTAMENTO_DE_RECURSOS_FINANCIEROS">DEPARTAMENTO DE RECURSOS FINANCIEROS</option>
        <option value="DEPARTAMENTO_DE_RECURSOS_MATERIALES_Y_SERVICIOS_GENERALES">DEPARTAMENTO DE RECURSOS MATERIALES Y SERVICIOS GENERALES</option>
        <option value="DEPARTAMENTO_DE_SEGUIMIENTO_DE_OBRAS_Y_MANTENIMIENTO">DEPARTAMENTO DE SEGUIMIENTO DE OBRAS Y MANTENIMIENTO</option>
        <option value="DEPARTAMENTO_DE_SERVICIO_SOCIAL_TITULACIÓN_Y_SEGUIMIENTO_DE_EGRESADOS">DEPARTAMENTO DE SERVICIO SOCIAL, TITULACIÓN Y SEGUIMIENTO DE EGRESADOS</option>
        <option value="DIRECCIÓN_DE_DIVISIÓN_DE_INGENIERÍA_EN_INFORMÁTICA">DIRECCIÓN DE DIVISIÓN DE INGENIERÍA EN INFORMÁTICA</option>
        <option value="DIRECCIÓN_DE_DIVISIÓN_DE_INGENIERÍA_EN_NANOTECNOLOGÍA">DIRECCIÓN DE DIVISIÓN DE INGENIERÍA EN NANOTECNOLOGÍA</option>
        <option value="DIRECCIÓN_DE_DIVISIÓN_DE_INGENIERÍA_INDUSTRIAL">DIRECCIÓN DE DIVISIÓN DE INGENIERÍA INDUSTRIAL</option>
        <option value="DIRECCIÓN_DE_DIVISIÓN_DE_INGENIERÍA_MECATRÓNICA">DIRECCIÓN DE DIVISIÓN DE INGENIERÍA MECATRÓNICA</option>
        <option value="DIRECCIÓN_DE_DIVISIÓN_DE_LICENCIATURA_EN_ADMINISTRACIÓN_Y_GESTIÓN_DE_PYMES">DIRECCIÓN DE DIVISIÓN DE LICENCIATURA EN ADMINISTRACIÓN Y GESTIÓN DE PYMES</option>
        <option value="DIRECCIÓN_DE_EXTENSIÓN_UNIVERSITARIA_Y_VINCULACIÓN">DIRECCIÓN DE EXTENSIÓN UNIVERSITARIA Y VINCULACIÓN</option>
        <option value="ÓRGANO_INTERNO_DE_CONTROL">ÓRGANO INTERNO DE CONTROL</option>

        <!-- ... resto de opciones ... -->

</div>

<!-- Servicio solicitado -->

    <label for="servicioSelect">10. Servicio solicitado</label>
    <select id="servicioSelect" name="servicio" onchange="mostrarSubservicio()">
        <option value="">Selecciona la respuesta</option>
        <option value="consulta">Consulta en sala</option>
        <option value="devolucion">Devolución de material</option>
        <option value="renovacion">Renovación de material</option>
        <option value="prestamo">Préstamo de material</option>
        <option value="cubiculo">Cubículo</option>
        <option value="digital">Biblioteca digital</option>
        <option value="actividades">Actividades en biblioteca</option>
    </select>
</div>

<!-- 11. Especifica título -->
<div id="opcionComunBox" class="opcional">
    <label for="opcionComun">11. Especifica Título (libro, materia, obligatorio)</label>
    <input id="opcionComun" name="opcionComun" type="text" placeholder="">
</div>

<!-- 11. Nombre de la biblioteca digital -->
<div id="digitalNombreBox" class="opcional">
    <label for="digitalNombre">11. Nombre de la biblioteca digital a consultar</label>
    <select id="digitalNombre" name="digitalNombre" onchange="mostrarTituloDigital()">
        <option value="">Selecciona una biblioteca</option>
        <option value="biblioteca1">Biblioteca 1</option>
        <option value="biblioteca2">Biblioteca 2</option>
    </select>
</div>

<!-- 12. Especifica título de la digital -->
<div id="digitalTituloBox" class="opcional">
    <label for="digitalTitulo">12. Especifica Título (libro, materia, obligatorio)</label>
    <input id="digitalTitulo" name="digitalTitulo" type="text">
</div>

<!-- 11. Número de cubículo -->
<div id="cubiculoNumBox" class="opcional">
    <label for="numCubiculo">11. Número de cubículo</label>
    <select name="numCubiculo" id="numCubiculo" onchange="mostrarActividadCubiculo()">
        <option value="">Selecciona cubículo</option>
        <option value="1">Cubículo 1</option>
        <option value="2">Cubículo 2</option>
        <option value="3">Cubículo 3</option>
    </select>
</div>

<!-- 12. Actividad cubículo -->
<div id="cubiculoActBox" class="opcional">
    <label for="actividadCubiculo">12. Especifica la actividad que se va a realizar</label>
    <input type="text" id="actividadCubiculo" name="actividadCubiculo">
</div>

<!-- 12. Actividad a realizar -->
<div id="actividadesBox" class="opcional">
    <label for="actividadBiblioteca">11. Especifica la actividad que se va a realizar</label>
    <input type="text" id="actividadBiblioteca" name="actividadBiblioteca">
</div>

<button type="submit">Enviar</button>
</form>

<script>
function ocultar(...ids){
    ids.forEach(id=>{
        const el = document.getElementById(id);
        if(!el) return;

        // 🔹 Limpiar valores de todos los <input>, <select> y <textarea> que haya dentro
        el.querySelectorAll('input, select, textarea').forEach(campo=>{
            if(campo.type === 'checkbox' || campo.type === 'radio'){
                campo.checked = false;
            } else if(campo.tagName.toLowerCase() === 'select'){
                campo.selectedIndex = 0; // vuelve a la opción inicial
            } else {
                campo.value = '';
            }
        });

        // 🔹 Ocultar contenedor
        el.style.display = 'none';
    });
}

function mostrarCampo(){
    const f = document.getElementById('funcion').value;
    ocultar(
        'carrera','adscripcion','servicio',
        'opcionComunBox','digitalNombreBox','digitalTituloBox',
        'cubiculoNumBox','cubiculoActBox','actividadesBox'
    );

    if(f==='estudiante' || f==='egresado'){
        document.getElementById('carrera').style.display='block';
    } else if(f==='profesor' || f==='administrativo'){
        document.getElementById('adscripcion').style.display='block';
    } else if(f==='externo'){
        document.getElementById('servicio').style.display='block';
    }
}

function mostrarServicioEstudiante(){
    const c = document.getElementById('carreraSelect').value;
    ocultar(
        'servicio',
        'opcionComunBox','digitalNombreBox','digitalTituloBox',
        'cubiculoNumBox','cubiculoActBox','actividadesBox'
    );
    if(c){
        document.getElementById('servicio').style.display = 'block';
    }
}

function mostrarServicioAds(){
    const a = document.getElementById('adsSelect').value;
    ocultar(
        'servicio',
        'opcionComunBox','digitalNombreBox','digitalTituloBox',
        'cubiculoNumBox','cubiculoActBox','actividadesBox'
    );
    if(a){
        document.getElementById('servicio').style.display = 'block';
    }
}

function mostrarSubservicio(){
    const s = document.getElementById('servicioSelect').value;
    ocultar(
        'opcionComunBox','digitalNombreBox','digitalTituloBox',
        'cubiculoNumBox','cubiculoActBox','actividadesBox'
    );

    if(['consulta','devolucion','renovacion','prestamo'].includes(s)){
        document.getElementById('opcionComunBox').style.display='block';
    }
    else if(s==='digital'){
        document.getElementById('digitalNombreBox').style.display='block';
    }
    else if(s==='cubiculo'){
        document.getElementById('cubiculoNumBox').style.display='block';
    }
    else if(s==='actividades'){
        document.getElementById('actividadesBox').style.display='block';
    }
}

function mostrarTituloDigital(){
    const d = document.getElementById('digitalNombre').value;
    ocultar('digitalTituloBox');
    if(d){
        document.getElementById('digitalTituloBox').style.display = 'block';
    }
}

function mostrarActividadCubiculo(){
    const c = document.getElementById('numCubiculo').value;
    ocultar('cubiculoActBox');
    if(c){
        document.getElementById('cubiculoActBox').style.display = 'block';
    }
}
</script>
</body>
</html>
